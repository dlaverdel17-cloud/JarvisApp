<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>JARVIS - Asistente Académico</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#06101f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <style>

    :root {
      --bg: #020713;
      --bg-soft: #071426;

      --cyan: #42e8ff;
      --cyan-soft: rgba(66, 232, 255, 0.15);

      --purple: #8c6cff;
      --purple-soft: rgba(140, 108, 255, 0.16);

      --pink: #e98cff;

      --white: #f5f8ff;
      --text: #b8c5d7;
      --muted: #718096;

      --border: rgba(66, 232, 255, 0.16);

      --panel:
        rgba(7, 19, 38, 0.82);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(62, 119, 255, 0.15),
          transparent 35%
        ),

        radial-gradient(
          circle at 80% 50%,
          rgba(139, 92, 246, 0.08),
          transparent 35%
        ),

        linear-gradient(
          rgba(66, 232, 255, 0.025) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(66, 232, 255, 0.025) 1px,
          transparent 1px
        ),

        var(--bg);

      background-size:
        auto,
        auto,
        42px 42px,
        42px 42px;

      color: var(--white);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
    }


    button,
    input {
      font: inherit;
    }


    button {
      -webkit-appearance: none;
    }


    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        max(16px, env(safe-area-inset-top))
        18px
        max(18px, env(safe-area-inset-bottom));
    }


    /* =========================
       HEADER
    ========================= */

    .topbar {
      width: 100%;
      max-width: 1050px;

      margin: 0 auto;

      height: 68px;

      display: grid;
      grid-template-columns: 60px 1fr 60px;

      align-items: center;
    }


    .menu-btn,
    .status-btn {
      width: 52px;
      height: 52px;

      border-radius: 17px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(14, 33, 58, 0.9),
          rgba(4, 12, 27, 0.95)
        );

      color: var(--cyan);

      cursor: pointer;

      display: grid;
      place-items: center;

      box-shadow:
        inset 0 0 20px rgba(66, 232, 255, 0.025),
        0 10px 30px rgba(0, 0, 0, 0.18);
    }


    .menu-btn {
      font-size: 1.4rem;
    }


    .status-btn {
      justify-self: end;
      position: relative;
    }


    .status-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #4cffb8;

      box-shadow:
        0 0 12px #4cffb8,
        0 0 25px rgba(76, 255, 184, 0.45);
    }


    .brand {
      text-align: center;
    }


    .brand h1 {
      font-size: clamp(1.45rem, 4vw, 2.3rem);

      letter-spacing: 8px;

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          #7da9ff,
          var(--purple),
          var(--pink)
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }


    .brand p {
      margin-top: 3px;

      color: var(--muted);

      font-size: 0.57rem;

      letter-spacing: 3px;

      text-transform: uppercase;
    }


    /* =========================
       MAIN
    ========================= */

    .main {
      width: 100%;
      max-width: 850px;

      margin: 0 auto;

      flex: 1;

      display: flex;
      flex-direction: column;

      padding-top: 25px;
    }


    /* =========================
       JARVIS HERO
    ========================= */

    .jarvis-hero {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;

      padding: 12px 0 25px;
    }


    .reactor-container {
      width: min(190px, 50vw);
      aspect-ratio: 1;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        transform 0.3s ease;
    }


    .reactor-container:active {
      transform: scale(0.96);
    }


    .glow-sphere {
      position: absolute;

      width: 58%;
      height: 58%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(83, 231, 255, 0.75) 0%,
          rgba(84, 100, 255, 0.48) 35%,
          rgba(148, 73, 255, 0.28) 60%,
          transparent 76%
        );

      filter: blur(18px);

      animation:
        spherePulse 4s ease-in-out infinite;
    }


    .ring {
      position: absolute;

      border-radius: 50%;
    }


    .ring-outer {
      width: 100%;
      height: 100%;

      border:
        1px solid rgba(66, 232, 255, 0.22);

      box-shadow:
        0 0 20px rgba(66, 232, 255, 0.08);
    }


    .ring-1 {
      width: 82%;
      height: 82%;

      border: 2px solid transparent;

      border-top-color: var(--cyan);
      border-right-color: var(--purple);
      border-bottom-color: var(--purple);

      box-shadow:
        0 0 20px rgba(140, 108, 255, 0.25);

      animation:
        spinRight 12s linear infinite;
    }


    .ring-2 {
      width: 65%;
      height: 65%;

      border:
        2px solid rgba(66, 232, 255, 0.85);

      border-left-color: transparent;

      box-shadow:
        0 0 20px rgba(66, 232, 255, 0.35);

      animation:
        spinLeft 8s linear infinite;
    }


    .core {
      width: 43%;
      height: 43%;

      border-radius: 50%;

      position: relative;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(66, 232, 255, 0.7);

      background:
        radial-gradient(
          circle at 35% 30%,
          #315a91,
          #121a43 60%,
          #07101f
        );

      box-shadow:
        0 0 25px rgba(66, 232, 255, 0.35),
        inset 0 0 25px rgba(66, 232, 255, 0.15);
    }


    .sound-wave {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 4px;

      height: 40px;
    }


    .wave-bar {
      width: 4px;

      border-radius: 10px;

      background:
        linear-gradient(
          to top,
          var(--cyan),
          var(--purple),
          var(--pink)
        );

      box-shadow:
        0 0 8px var(--cyan);
    }


    .wave-bar:nth-child(1),
    .wave-bar:nth-child(5) {
      height: 13px;
    }


    .wave-bar:nth-child(2),
    .wave-bar:nth-child(4) {
      height: 23px;
    }


    .wave-bar:nth-child(3) {
      height: 34px;
    }


    /* LISTENING */

    .active-listening .glow-sphere {
      animation:
        activePulse 0.7s ease-in-out infinite alternate;

      filter: blur(25px);
    }


    .active-listening .ring-1 {
      animation-duration: 2s;
    }


    .active-listening .ring-2 {
      animation-duration: 1.4s;
    }


    .active-listening .wave-bar {
      animation:
        waveMotion 0.5s ease-in-out infinite alternate;
    }


    /* PROCESSING */

    .processing .ring-1,
    .processing .ring-2 {
      animation-duration: 1s;
    }


    .processing .core {
      box-shadow:
        0 0 45px rgba(140, 108, 255, 0.65),
        inset 0 0 25px rgba(140, 108, 255, 0.2);
    }


    /* RESPONDING */

    .responding .glow-sphere {
      animation:
        responsePulse 1s ease-in-out infinite;
    }


    .responding .core {
      box-shadow:
        0 0 45px rgba(66, 232, 255, 0.7),
        inset 0 0 25px rgba(66, 232, 255, 0.2);
    }


    /* =========================
       STATUS
    ========================= */

    .status-area {
      text-align: center;
    }


    #main-status {
      color: var(--cyan);

      font-size: 0.9rem;

      font-weight: 800;

      letter-spacing: 4px;

      text-transform: uppercase;

      text-shadow:
        0 0 15px rgba(66, 232, 255, 0.45);
    }


    #sub-status {
      margin-top: 8px;

      color: var(--muted);

      font-size: 0.83rem;
    }


    /* =========================
       CHAT AREA
    ========================= */

    .chat-shell {
      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      flex: 1;
    }


    .chat-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 10px;

      padding: 0 4px;
    }


    .chat-header h2 {
      font-size: 0.85rem;

      letter-spacing: 2px;

      color: var(--text);

      text-transform: uppercase;
    }


    .chat-header span {
      color: var(--muted);

      font-size: 0.72rem;
    }


    .chat-box {
      width: 100%;

      min-height: 280px;
      max-height: 48vh;

      overflow-y: auto;

      padding: 18px;

      border-radius: 24px;

      border:
        1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(9, 24, 45, 0.88),
          rgba(3, 10, 23, 0.92)
        );

      box-shadow:
        inset 0 0 35px rgba(66, 232, 255, 0.025),
        0 18px 45px rgba(0, 0, 0, 0.16);

      scroll-behavior: smooth;
    }


    .message {
      width: 100%;

      display: flex;
      flex-direction: column;

      margin-bottom: 18px;
    }


    .message.user {
      align-items: flex-end;
    }


    .message.jarvis {
      align-items: flex-start;
    }


    .message-label {
      font-size: 0.65rem;

      letter-spacing: 2px;

      margin-bottom: 6px;

      color: var(--muted);
    }


    .message.user .message-label {
      color: var(--purple);
    }


    .message.jarvis .message-label {
      color: var(--cyan);
    }


    .message-content {
      max-width: min(90%, 620px);

      padding: 14px 16px;

      border-radius: 18px;

      color: var(--text);

      font-size: 0.9rem;

      line-height: 1.6;

      white-space: pre-wrap;
      word-break: break-word;
    }


    .message.user .message-content {
      border-bottom-right-radius: 5px;

      background:
        linear-gradient(
          135deg,
          rgba(108, 82, 255, 0.25),
          rgba(47, 26, 93, 0.45)
        );

      border:
        1px solid rgba(140, 108, 255, 0.22);
    }


    .message.jarvis .message-content {
      border-bottom-left-radius: 5px;

      background:
        rgba(66, 232, 255, 0.045);

      border:
        1px solid rgba(66, 232, 255, 0.12);
    }


    .message-tools {
      display: flex;
      gap: 8px;

      margin-top: 7px;
    }


    .speak-btn {
      height: 34px;

      padding: 0 12px;

      border-radius: 10px;

      border:
        1px solid rgba(66, 232, 255, 0.18);

      background:
        rgba(66, 232, 255, 0.05);

      color: var(--cyan);

      cursor: pointer;

      font-size: 0.72rem;
    }


    /* =========================
       INPUT
    ========================= */

    .input-area {
      width: 100%;

      display: flex;

      gap: 9px;

      margin-top: 14px;

      padding: 8px;

      border-radius: 23px;

      border:
        1px solid rgba(66, 232, 255, 0.22);

      background:
        rgba(5, 15, 31, 0.92);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.18);
    }


    #text-input {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: var(--white);

      padding: 12px 13px;

      font-size: 0.92rem;
    }


    #text-input::placeholder {
      color: var(--muted);
    }


    .send-btn {
      width: 54px;
      height: 54px;

      flex-shrink: 0;

      border: none;

      border-radius: 17px;

      color: white;

      font-size: 1.2rem;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          var(--cyan),
          var(--purple)
        );

      box-shadow:
        0 0 20px rgba(66, 232, 255, 0.18);
    }


    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;

      top: 0;
      left: 0;

      width: min(320px, 85vw);
      height: 100dvh;

      z-index: 1000;

      padding: 24px 18px;

      background:
        rgba(4, 12, 28, 0.98);

      border-right:
        1px solid var(--border);

      transform:
        translateX(-110%);

      transition:
        transform 0.3s ease;

      display: flex;
      flex-direction: column;

      box-shadow:
        25px 0 80px rgba(0, 0, 0, 0.45);
    }


    .sidebar.open {
      transform: translateX(0);
    }


    .sidebar-top {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 25px;
    }


    .sidebar-title {
      color: var(--cyan);

      font-weight: 900;

      letter-spacing: 5px;
    }


    .close-menu {
      width: 42px;
      height: 42px;

      border-radius: 14px;

      border:
        1px solid var(--border);

      background:
        transparent;

      color: var(--white);

      cursor: pointer;
    }


    .menu-item {
      width: 100%;

      min-height: 52px;

      border: none;

      border-radius: 15px;

      padding: 0 14px;

      display: flex;

      align-items: center;

      gap: 13px;

      text-align: left;

      color: var(--text);

      background: transparent;

      cursor: pointer;

      font-size: 0.9rem;
    }


    .menu-item:hover,
    .menu-item:active {
      background:
        rgba(66, 232, 255, 0.07);

      color: var(--cyan);
    }


    .menu-divider {
      height: 1px;

      background:
        rgba(255, 255, 255, 0.07);

      margin: 14px 0;
    }


    .overlay {
      position: fixed;

      inset: 0;

      z-index: 999;

      background:
        rgba(0, 0, 0, 0.5);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.3s ease;
    }


    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes spinRight {
      to {
        transform: rotate(360deg);
      }
    }


    @keyframes spinLeft {
      to {
        transform: rotate(-360deg);
      }
    }


    @keyframes spherePulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.9;
      }
    }


    @keyframes activePulse {
      from {
        transform: scale(0.9);
      }

      to {
        transform: scale(1.45);
      }
    }


    @keyframes responsePulse {
      0%, 100% {
        transform: scale(0.9);
      }

      50% {
        transform: scale(1.28);
      }
    }


    @keyframes waveMotion {
      from {
        transform: scaleY(0.5);
      }

      to {
        transform: scaleY(1.45);
      }
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 900px) {

      .main {
        padding-top: 35px;
      }

      .jarvis-hero {
        padding-bottom: 28px;
      }

      .reactor-container {
        width: 210px;
      }

      .chat-box {
        max-height: 44vh;
      }

    }


    @media (max-width: 600px) {

      .app {
        padding-left: 13px;
        padding-right: 13px;
      }

      .topbar {
        grid-template-columns: 52px 1fr 52px;
      }

      .menu-btn,
      .status-btn {
        width: 47px;
        height: 47px;
      }

      .brand h1 {
        font-size: 1.35rem;
        letter-spacing: 5px;
      }

      .brand p {
        font-size: 0.48rem;
        letter-spacing: 1.8px;
      }

      .main {
        padding-top: 15px;
      }

      .jarvis-hero {
        padding-top: 4px;
        padding-bottom: 20px;
      }

      .reactor-container {
        width: min(155px, 43vw);
      }

      #main-status {
        font-size: 0.75rem;
        letter-spacing: 3px;
      }

      #sub-status {
        font-size: 0.76rem;
      }

      .chat-box {
        min-height: 300px;
        max-height: 48vh;

        padding: 14px;

        border-radius: 20px;
      }

      .message-content {
        font-size: 0.84rem;
      }

      .input-area {
        border-radius: 20px;
      }

      .send-btn {
        width: 50px;
        height: 50px;

        border-radius: 15px;
      }

    }

  </style>
</head>

<body>

  <div
    class="overlay"
    id="overlay"
    onclick="cerrarMenu()"
  ></div>


  <!-- MENU -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-top">

      <div class="sidebar-title">
        JARVIS
      </div>

      <button
        class="close-menu"
        onclick="cerrarMenu()"
      >
        ✕
      </button>

    </div>


    <button
      class="menu-item"
      onclick="nuevoChat()"
    >
      💬 Nuevo chat
    </button>


    <div class="menu-divider"></div>


    <button class="menu-item">
      📅 Plan de estudio
    </button>

    <button class="menu-item">
      📚 Mis materias
    </button>

    <button class="menu-item">
      📊 Estadísticas
    </button>

    <button class="menu-item">
      📝 Notas
    </button>

    <button class="menu-item">
      📷 Escanear
    </button>

    <button class="menu-item">
      📁 Archivos
    </button>


    <div class="menu-divider"></div>


    <button class="menu-item">
      🕘 Historial
    </button>

    <button class="menu-item">
      ⚙️ Configuración
    </button>

    <button class="menu-item">
      👤 Perfil
    </button>

  </aside>



  <main class="app">


    <!-- HEADER -->

    <header class="topbar">

      <button
        class="menu-btn"
        onclick="abrirMenu()"
      >
        ☰
      </button>


      <div class="brand">

        <h1>
          JARVIS
        </h1>

        <p>
          Tu asistente inteligente de estudio
        </p>

      </div>


      <button
        class="status-btn"
        title="JARVIS Online"
      >
        <span class="status-dot"></span>
      </button>

    </header>



    <section class="main">


      <!-- NUCLEO -->

      <section class="jarvis-hero">

        <div
          class="reactor-container"
          id="reactor-core"
          onclick="activarJarvis()"
          title="Toca para hablar con JARVIS"
        >

          <div class="glow-sphere"></div>

          <div class="ring ring-outer"></div>

          <div class="ring ring-1"></div>

          <div class="ring ring-2"></div>


          <div class="core">

            <div class="sound-wave">

              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>

            </div>

          </div>

        </div>


        <div class="status-area">

          <div id="main-status">
            JARVIS LISTO
          </div>

          <div id="sub-status">
            Toca el núcleo para hablar conmigo
          </div>

        </div>

      </section>



      <!-- CHAT -->

      <section class="chat-shell">


        <div class="chat-header">

          <h2>
            Conversación
          </h2>

          <span id="chat-time">
            --
          </span>

        </div>


        <div
          class="chat-box"
          id="chat-box"
        >

          <div class="message jarvis">

            <div class="message-label">
              JARVIS
            </div>

            <div class="message-content">
Hola 👋 Soy JARVIS, tu asistente académico inteligente.

Puedes escribirme una pregunta o tocar mi núcleo para hablar conmigo.
            </div>

          </div>

        </div>



        <!-- INPUT -->

        <div class="input-area">

          <input
            id="text-input"
            type="text"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
          >

          <button
            class="send-btn"
            onclick="enviarTexto()"
            title="Enviar"
          >
            ↑
          </button>

        </div>


      </section>


    </section>

  </main>



  <script>

    /* =========================
       BACKEND
    ========================= */

    const API_URL =
      "https://jarvisapp.onrender.com/api/jarvis";


    /* =========================
       HORA
    ========================= */

    function actualizarHora() {

      const now = new Date();

      document
        .getElementById("chat-time")
        .innerText =
        now.toLocaleTimeString(
          "es-CO",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    }


    actualizarHora();

    setInterval(
      actualizarHora,
      30000
    );


    /* =========================
       FECHA Y HORA PARA JARVIS
    ========================= */

    function obtenerContextoFecha() {

      const now = new Date();

      const fecha =
        now.toLocaleDateString(
          "es-CO",
          {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );

      const hora =
        now.toLocaleTimeString(
          "es-CO",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      return `
CONTEXTO ACTUAL:
Fecha actual: ${fecha}
Hora actual: ${hora}
Zona horaria del usuario: Colombia (America/Bogota).

Usa esta información cuando el usuario pregunte por la fecha, hora, hoy, mañana, ayer o eventos relacionados con el tiempo.
`;

    }


    /* =========================
       MENU
    ========================= */

    function abrirMenu() {

      document
        .getElementById("sidebar")
        .classList.add("open");

      document
        .getElementById("overlay")
        .classList.add("show");

    }


    function cerrarMenu() {

      document
        .getElementById("sidebar")
        .classList.remove("open");

      document
        .getElementById("overlay")
        .classList.remove("show");

    }


    /* =========================
       CHAT
    ========================= */

    function agregarMensaje(
      tipo,
      texto,
      agregarBotonVoz = false
    ) {

      const chatBox =
        document.getElementById("chat-box");


      const message =
        document.createElement("div");

      message.className =
        `message ${tipo}`;


      const label =
        document.createElement("div");

      label.className =
        "message-label";

      label.innerText =
        tipo === "user"
          ? "TÚ"
          : "JARVIS";


      const content =
        document.createElement("div");

      content.className =
        "message-content";

      content.innerText =
        texto;


      message.appendChild(label);

      message.appendChild(content);


      if (
        tipo === "jarvis" &&
        agregarBotonVoz
      ) {

        const tools =
          document.createElement("div");

        tools.className =
          "message-tools";


        const speakButton =
          document.createElement("button");

        speakButton.className =
          "speak-btn";

        speakButton.innerText =
          "🔊 Escuchar";


        speakButton.onclick =
          () => hablar(texto);


        tools.appendChild(
          speakButton
        );


        message.appendChild(
          tools
        );

      }


      chatBox.appendChild(
        message
      );


      chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: "smooth"
      });

    }


    function nuevoChat() {

      const chatBox =
        document.getElementById("chat-box");

      chatBox.innerHTML = "";

      agregarMensaje(
        "jarvis",
        "Hola 👋 Soy JARVIS. ¿Qué quieres aprender hoy?"
      );

      cerrarMenu();

    }


    /* =========================
       VOZ
    ========================= */

    let vocesDisponibles = [];


    function cargarVoces() {

      vocesDisponibles =
        window.speechSynthesis.getVoices();

    }


    if (
      "speechSynthesis" in window
    ) {

      cargarVoces();

      window
        .speechSynthesis
        .onvoiceschanged =
        cargarVoces;

    }


    function elegirMejorVoz() {

      const voces =
        vocesDisponibles.length
          ? vocesDisponibles
          : window.speechSynthesis.getVoices();


      const prioridades = [

        "es-CO",

        "es-US",

        "es-MX",

        "es-ES",

        "es"

      ];


      for (
        const idioma of prioridades
      ) {

        const voz =
          voces.find(
            v =>
              v.lang &&
              v.lang
                .toLowerCase()
                .startsWith(
                  idioma.toLowerCase()
                )
          );

        if (voz) {
          return voz;
        }

      }


      return voces.find(
        v =>
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("es")
      );

    }


    function hablar(texto) {

      if (
        !("speechSynthesis" in window)
      ) {
        return;
      }


      window
        .speechSynthesis
        .cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          texto
        );


      utterance.lang =
        "es-CO";


      utterance.rate =
        1;


      utterance.pitch =
        0.95;


      const mejorVoz =
        elegirMejorVoz();


      if (mejorVoz) {

        utterance.voice =
          mejorVoz;

        utterance.lang =
          mejorVoz.lang;

      }


      window
        .speechSynthesis
        .speak(
          utterance
        );

    }


    /* =========================
       CONSULTAR JARVIS
    ========================= */

    async function consultarJarvis(
      texto,
      modoVoz = false
    ) {

      if (
        !texto ||
        !texto.trim()
      ) {
        return;
      }


      const core =
        document.getElementById(
          "reactor-core"
        );


      const mainStatus =
        document.getElementById(
          "main-status"
        );


      const subStatus =
        document.getElementById(
          "sub-status"
        );


      core.classList.remove(
        "active-listening",
        "responding"
      );

      core.classList.add(
        "processing"
      );


      mainStatus.innerText =
        "PROCESANDO";


      subStatus.innerText =
        "JARVIS está analizando tu pregunta";


      agregarMensaje(
        "user",
        texto
      );


      try {

        const promptConContexto =
          obtenerContextoFecha() +
          "\n\nPREGUNTA DEL USUARIO:\n" +
          texto;


        const res =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  prompt:
                    promptConContexto
                })

            }
          );


        if (!res.ok) {

          throw new Error(
            "Error en el servidor"
          );

        }


        const data =
          await res.json();


        const respuesta =
          data.reply ||
          "No recibí una respuesta.";


        core.classList.remove(
          "processing"
        );


        core.classList.add(
          "responding"
        );


        mainStatus.innerText =
          "RESPONDIENDO";


        subStatus.innerText =
          modoVoz
            ? "JARVIS te está respondiendo"
            : "Respuesta recibida";


        agregarMensaje(
          "jarvis",
          respuesta,
          true
        );


        /*
          SOLO HABLA
          SI LA PREGUNTA
          FUE POR VOZ
        */

        if (modoVoz) {

          hablar(
            respuesta
          );

        }


        setTimeout(
          () => {

            core.classList.remove(
              "responding"
            );

            mainStatus.innerText =
              "JARVIS LISTO";

            subStatus.innerText =
              "Escribe o toca el núcleo para hablar";

          },
          2500
        );


      } catch (err) {

        console.error(err);


        core.classList.remove(
          "processing"
        );


        mainStatus.innerText =
          "ERROR DE CONEXIÓN";


        subStatus.innerText =
          "No pude conectar con JARVIS";


        agregarMensaje(
          "jarvis",
          "⚠️ No pude comunicarme con el servidor de JARVIS. Revisa que Python y ngrok continúen funcionando."
        );

      }

    }


    /* =========================
       CHAT ESCRITO
    ========================= */

    function enviarTexto() {

      const input =
        document.getElementById(
          "text-input"
        );


      const texto =
        input.value.trim();


      if (!texto) {
        return;
      }


      input.value = "";


      /*
        CHAT ESCRITO:
        NO HABLA
      */

      consultarJarvis(
        texto,
        false
      );

    }


    document
      .getElementById(
        "text-input"
      )
      .addEventListener(
        "keydown",
        function(e) {

          if (
            e.key === "Enter"
          ) {

            enviarTexto();

          }

        }
      );


    /* =========================
       RECONOCIMIENTO DE VOZ
    ========================= */

    let recognitionActiva =
      false;


    function activarJarvis() {

      if (
        recognitionActiva
      ) {
        return;
      }


      const core =
        document.getElementById(
          "reactor-core"
        );


      const mainStatus =
        document.getElementById(
          "main-status"
        );


      const subStatus =
        document.getElementById(
          "sub-status"
        );


      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        mainStatus.innerText =
          "MICRÓFONO NO DISPONIBLE";


        subStatus.innerText =
          "Este navegador no permite reconocimiento de voz";


        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "es-CO";


      recognition.interimResults =
        false;


      recognition.maxAlternatives =
        1;


      recognition.onstart =
        () => {

          recognitionActiva =
            true;


          core.classList.remove(
            "processing",
            "responding"
          );


          core.classList.add(
            "active-listening"
          );


          mainStatus.innerText =
            "ESCUCHANDO";


          subStatus.innerText =
            "Habla con JARVIS ahora";

        };


      recognition.onresult =
        async (e) => {

          const texto =
            e.results[0][0].transcript;


          core.classList.remove(
            "active-listening"
          );


          /*
            MODO VOZ:
            JARVIS SÍ HABLA
          */

          await consultarJarvis(
            texto,
            true
          );

        };


      recognition.onerror =
        (e) => {

          console.log(
            "Error de voz:",
            e.error
          );


          core.classList.remove(
            "active-listening"
          );


          mainStatus.innerText =
            "INTENTA DE NUEVO";


          if (
            e.error ===
            "not-allowed"
          ) {

            subStatus.innerText =
              "Debes permitir el micrófono";

          } else {

            subStatus.innerText =
              "Toca el núcleo para volver a hablar";

          }

        };


      recognition.onend =
        () => {

          recognitionActiva =
            false;

          core.classList.remove(
            "active-listening"
          );

        };


      try {

        recognition.start();

      } catch (error) {

        recognitionActiva =
          false;

      }

    }

  </script>
